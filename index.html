<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十四行记 · 自驾旅行记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2c1f14;
    --ink-mid: #5a3e28;
    --ink-light: #9a7a60;
    --paper: #faf6ef;
    --paper-warm: #f3ead8;
    --paper-mid: #e8dcc8;
    --accent: #b85c38;
    --accent-soft: #d4835f;
    --gold: #c8973a;
    --gold-light: #e8c470;
    --sage: #7a9e7e;
    --stone: #8a7968;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    background: var(--ink);
    padding: 56px 28px 44px;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 85% 15%, rgba(200,151,58,0.16) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 85%, rgba(184,92,56,0.12) 0%, transparent 55%);
  }
  .deco-char {
    position: absolute;
    right: 20px;
    bottom: 16px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 96px;
    color: rgba(200,151,58,0.06);
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }
  .hero-eyebrow {
    display: inline-block;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold-light);
    opacity: 0.7;
    margin-bottom: 16px;
    position: relative;
  }
  .hero h1 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 40px;
    color: #f5edd8;
    line-height: 1.2;
    letter-spacing: 4px;
    position: relative;
  }
  .hero-desc {
    margin-top: 12px;
    font-size: 13px;
    color: rgba(245,237,216,0.45);
    letter-spacing: 1.5px;
    position: relative;
  }
  .hero-line {
    margin-top: 28px;
    height: 1px;
    background: linear-gradient(90deg, rgba(200,151,58,0.4), transparent);
    position: relative;
  }
  .hero-meta {
    margin-top: 14px;
    display: flex;
    gap: 20px;
    position: relative;
  }
  .hero-meta span {
    font-size: 11px;
    color: rgba(245,237,216,0.35);
    letter-spacing: 1px;
  }
  .hero-meta strong {
    color: rgba(245,237,216,0.7);
    font-weight: 400;
  }

  /* ─── YEAR GROUP ─── */
  .year-group {
    padding: 28px 24px 0;
  }
  .year-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .year-label span {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 20px;
    color: var(--ink);
    letter-spacing: 2px;
  }
  .year-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper-mid);
  }

  /* ─── TRIP CARD ─── */
  .trip-card {
    display: block;
    text-decoration: none;
    background: white;
    border: 1px solid var(--paper-mid);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    transition: border-color 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    position: relative;
  }
  .trip-card-seal {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 2;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.08));
    pointer-events: none;
  }
  .trip-card:active {
    transform: scale(0.985);
    border-color: var(--accent-soft);
  }
  .trip-card-top {
    padding: 16px 58px 14px 18px;
    border-bottom: 1px solid var(--paper-warm);
  }
  .trip-route {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--ink);
    line-height: 1.3;
  }
  .trip-route .arrow {
    color: var(--accent-soft);
    margin: 0 4px;
    font-size: 14px;
  }
  .trip-title {
    font-size: 12px;
    color: var(--stone);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }
  .trip-card-bottom {
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .trip-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }
  .tag-drive { background: #fdeee8; color: var(--accent); }
  .tag-days { background: var(--paper-warm); color: var(--stone); }
  .tag-season { background: #eef5ee; color: var(--sage); }
  .trip-date {
    font-size: 11px;
    color: var(--stone);
    letter-spacing: 0.5px;
    white-space: nowrap;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .trip-km {
    font-size: 10px;
    color: var(--ink-light);
  }

  /* ─── PLACEHOLDER ─── */
  .placeholder-card {
    border: 1px dashed var(--paper-mid);
    border-radius: 12px;
    padding: 22px 18px;
    text-align: center;
    margin-bottom: 12px;
  }
  .placeholder-card p {
    font-size: 12px;
    color: var(--stone);
    letter-spacing: 1px;
  }

  /* ─── FOOTER ─── */
  .footer {
    text-align: center;
    padding: 32px 24px 28px;
    font-size: 11px;
    color: var(--stone);
    letter-spacing: 2px;
    border-top: 1px solid var(--paper-mid);
    margin-top: 20px;
  }
  .footer .sub {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    color: var(--paper-mid);
    letter-spacing: 1px;
  }

  /* ============================
     旅行状态徽章 · Trip Status
     ============================ */
  .trip-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    line-height: 1;
    white-space: nowrap;
    vertical-align: middle;
  }

  .trip-status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* 规划中 */
  .trip-status[data-status="planning"] {
    color: var(--ink-light, #9a7a60);
    background: var(--paper-mid, #e8dcc8);
    border: 1px dashed var(--ink-light, #9a7a60);
  }
  .trip-status[data-status="planning"]::before {
    background: var(--ink-light, #9a7a60);
    opacity: 0.6;
  }

  /* 进行中 */
  .trip-status[data-status="active"] {
    color: var(--gold, #c8973a);
    background: rgba(200, 151, 58, 0.1);
    border: 1px solid var(--gold-light, #e8c470);
  }
  .trip-status[data-status="active"]::before {
    background: var(--gold, #c8973a);
    animation: status-pulse 2s ease-in-out infinite;
  }

  @keyframes status-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
  }

  /* 已完成 */
  .trip-status[data-status="completed"] {
    color: var(--sage, #7a9e7e);
    background: rgba(122, 158, 126, 0.1);
    border: 1px solid var(--sage, #7a9e7e);
  }
  .trip-status[data-status="completed"]::before {
    background: var(--sage, #7a9e7e);
  }

  /* 深色背景版（用于详情页 Hero 区） */
  .trip-status.on-dark[data-status="completed"] {
    color: var(--sage, #7a9e7e);
    background: rgba(122, 158, 126, 0.15);
    border-color: rgba(122, 158, 126, 0.4);
  }
  .trip-status.on-dark[data-status="active"] {
    color: var(--gold-light, #e8c470);
    background: rgba(232, 196, 112, 0.15);
    border-color: rgba(232, 196, 112, 0.4);
  }
  .trip-status.on-dark[data-status="planning"] {
    color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.06);
    border: 1px dashed rgba(255, 255, 255, 0.2);
  }

  /* ============================
     热力图 · Travel Heatmap
     ============================ */
  .heatmap {
    margin: 24px 24px 8px;
    padding: 16px 18px;
    background: white;
    border: 1px solid var(--paper-mid);
    border-radius: 12px;
  }
  .heatmap-toggle {
    display: inline-flex;
    background: var(--paper-warm);
    border-radius: 999px;
    padding: 3px;
    margin-bottom: 12px;
  }
  .heatmap-toggle button {
    border: 0;
    background: transparent;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    color: var(--ink-mid);
    padding: 5px 14px;
    border-radius: 999px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: background 0.18s, color 0.18s;
  }
  .heatmap-toggle button.active {
    background: var(--accent);
    color: var(--paper);
    font-weight: 400;
  }
  .heatmap-stats {
    font-size: 11px;
    color: var(--stone);
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    line-height: 1.6;
  }
  .heatmap-stats strong {
    color: var(--ink);
    font-weight: 400;
  }
  .heatmap-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: opacity 0.15s;
  }
  .heatmap-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .heatmap-year-label {
    width: 36px;
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 13px;
    color: var(--ink-mid);
    flex-shrink: 0;
  }
  .heatmap-cell {
    width: 26px;
    height: 26px;
    border-radius: 4px;
    background: transparent;
    border: 1px solid var(--paper-mid);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    flex-shrink: 0;
  }
  .heatmap-cell[data-level="1"] { background: var(--paper-mid); border-color: var(--paper-mid); }
  .heatmap-cell[data-level="2"] { background: var(--gold-light); border-color: var(--gold-light); }
  .heatmap-cell[data-level="3"] { background: var(--gold); border-color: var(--gold); }
  .heatmap-cell a { line-height: 0; }
  .heatmap-cell .trip-seal { cursor: pointer; }
  .heatmap-cell a + a { margin-left: -8px; }
  .heatmap-cell sup {
    font-size: 9px;
    color: var(--ink);
    margin-left: 2px;
  }

  .heatmap-months {
    display: flex;
    gap: 4px;
    margin-left: 40px;
    margin-bottom: 4px;
  }
  .heatmap-months span {
    width: 26px;
    text-align: center;
    font-size: 9px;
    color: var(--stone);
    letter-spacing: 0;
  }

  .heatmap-year-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .heatmap-year-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .heatmap-year-cell {
    width: 56px;
    height: 56px;
    border-radius: 6px;
    border: 1px solid var(--paper-mid);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    padding: 4px;
    gap: 2px;
  }
  .heatmap-year-cell[data-level="1"] { background: var(--paper-mid); border-color: var(--paper-mid); }
  .heatmap-year-cell[data-level="2"] { background: var(--gold-light); border-color: var(--gold-light); }
  .heatmap-year-cell[data-level="3"] { background: var(--gold); border-color: var(--gold); }
  .heatmap-year-cell a { line-height: 0; }
  .heatmap-year-item-label {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 12px;
    color: var(--ink-mid);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="deco-char">行</div>
  <div class="hero-eyebrow">ROAD TRIP JOURNAL</div>
  <h1>十四行记</h1>
  <p class="hero-desc">自驾 · 行旅 · 记录</p>
  <div class="hero-line"></div>
  <div class="hero-meta">
    <span><strong id="trip-count">—</strong> 次旅行</span>
    <span><strong id="km-count">—</strong> 公里</span>
    <span><strong id="city-count">6</strong> 座城市</span>
  </div>
</div>

<section class="heatmap" id="heatmap">
  <div class="heatmap-toggle">
    <button type="button" data-mode="month" class="active">月度</button>
    <button type="button" data-mode="year">年度</button>
  </div>
  <div class="heatmap-stats" id="heatmap-stats">—</div>
  <div class="heatmap-grid" id="heatmap-grid"></div>
</section>

<div class="year-group">
  <div class="year-label">
    <span>2026</span>
  </div>

  <a class="trip-card" id="trip-2" href="trips/2026-05-bjs-tsn.html">
    <div class="trip-card-top">
      <div class="trip-route">
        北京<span class="arrow">→</span>天津
      </div>
      <div class="trip-title">周末两日 · 海河与五大道</div>
    </div>
    <div class="trip-card-bottom">
      <div class="trip-tags">
        <span class="tag tag-drive">自驾</span>
        <span class="tag tag-days">2 天</span>
        <span class="tag tag-season">春季</span>
      </div>
      <div style="text-align:right;">
        <div class="trip-date">2026.5.16 – 5.17</div>
        <div class="trip-km">约 260 km</div>
      </div>
      <span class="trip-status" data-status="planning">规划中</span>
    </div>
  </a>

  <a class="trip-card" id="trip-1" href="trips/2026-05-xiy-bjs.html">
    <div class="trip-card-top">
      <div class="trip-route">
        西安<span class="arrow">→</span>洛阳<span class="arrow">→</span>平遥<span class="arrow">→</span>北京
      </div>
      <div class="trip-title">五一自驾 · 穿越中原与山西</div>
    </div>
    <div class="trip-card-bottom">
      <div class="trip-tags">
        <span class="tag tag-drive">自驾</span>
        <span class="tag tag-days">7 天</span>
        <span class="tag tag-season">春季</span>
      </div>
      <div style="text-align:right;">
        <div class="trip-date">2026.5.1 – 5.7</div>
        <div class="trip-km">约 1,380 km</div>
      </div>
      <span class="trip-status" data-status="completed">已完成</span>
    </div>
  </a>

  <div class="placeholder-card">
    <p>下一次旅行，待续……</p>
  </div>
</div>

<div class="footer">
  十四行记 · 两人同行
  <span class="sub">github.io · static travel journal</span>
</div>

<script>
  // ====== 数据源 ======
  const trips = [
    {
      id: 'trip-1',
      file: 'trips/2026-05-xiy-bjs.html',
      start: '2026-05-01',
      end: '2026-05-07',
      days: 7,
      km: 1380,
      status: 'completed',
      route: ['西安', '洛阳', '平遥', '北京'],
      title: '五一自驾 · 穿越中原与山西',
      summary: '西安 → 北京 · 五一七日'
    },
    {
      id: 'trip-2',
      file: 'trips/2026-05-bjs-tsn.html',
      start: '2026-05-16',
      end: '2026-05-17',
      days: 2,
      km: 260,
      status: 'planning',
      route: ['北京', '天津'],
      title: '周末两日 · 海河与五大道',
      summary: '北京 → 天津 · 周末两日'
    }
  ].sort((a, b) => a.start.localeCompare(b.start));

  // 运行时序号 = 数组索引 + 1（按 start 升序）
  trips.forEach((t, i) => { t.seq = i + 1; });

  // ====== 朱印徽章模板 ======
  function tripBadge(n, opts) {
    const size = (opts && opts.size) || 32;
    const fontSize = Math.round(size * 0.7);
    return `<svg class="trip-seal" viewBox="0 0 48 48" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" aria-label="第${n}段">
      <rect x="2" y="2" width="44" height="44" rx="6" fill="var(--accent)"/>
      <!-- y: viewBox 中线 24 + 约 35% fontSize 用于视觉居中（基线补偿） -->
      <text x="24" y="${24 + fontSize * 0.35}" text-anchor="middle"
            font-family="'ZCOOL XiaoWei', serif" font-size="${fontSize}"
            fill="var(--paper)" font-weight="600">${n}</text>
    </svg>`;
  }

  // ====== 自动 hero 统计 ======
  (function updateHeroStats() {
    const tcEl = document.getElementById('trip-count');
    const kmEl = document.getElementById('km-count');
    if (tcEl) tcEl.textContent = trips.length;
    if (kmEl) kmEl.textContent = trips.reduce((s, t) => s + t.km, 0).toLocaleString();
    // city-count 保留手填（route 数据未完整时不自动算）
  })();

  // ====== 热力图：通用工具 ======
  function tripMonths(t) {
    // 返回该 trip 涵盖的 [{year, month, daysInMonth}]
    const s = new Date(t.start), e = new Date(t.end);
    const out = [];
    let y = s.getFullYear(), m = s.getMonth();
    const ey = e.getFullYear(), em = e.getMonth();
    while (y < ey || (y === ey && m <= em)) {
      const monthStart = new Date(y, m, 1);
      const monthEnd = new Date(y, m + 1, 0);
      const overlapStart = s > monthStart ? s : monthStart;
      const overlapEnd = e < monthEnd ? e : monthEnd;
      const days = Math.round((overlapEnd - overlapStart) / 86400000) + 1;
      out.push({ year: y, month: m, days });
      m++; if (m > 11) { m = 0; y++; }
    }
    return out;
  }

  function levelByDays(d) {
    if (d <= 0) return 0;
    if (d <= 2) return 1;
    if (d <= 5) return 2;
    return 3;
  }

  function levelByKm(km) {
    if (km <= 0) return 0;
    if (km < 500) return 1;
    if (km < 1500) return 2;
    return 3;
  }

  // ====== 月度视图渲染 ======
  function renderMonthView() {
    const grid = document.getElementById('heatmap-grid');
    const stats = document.getElementById('heatmap-stats');
    if (!grid || !stats) return;

    // 聚合：year -> month -> { days, trips: [seq] }
    const agg = {};
    const monthCounter = {};
    trips.forEach(t => {
      tripMonths(t).forEach(({ year, month, days }) => {
        agg[year] = agg[year] || {};
        agg[year][month] = agg[year][month] || { days: 0, trips: [] };
        agg[year][month].days += days;
        agg[year][month].trips.push(t.seq);
        monthCounter[month + 1] = (monthCounter[month + 1] || 0) + 1;
      });
    });

    // 找峰值月
    let peakMonth = null, peakCount = 0;
    Object.keys(monthCounter).forEach(m => {
      if (monthCounter[m] > peakCount) { peakCount = monthCounter[m]; peakMonth = m; }
    });

    const years = Object.keys(agg).sort();
    const totalKm = trips.reduce((s, t) => s + t.km, 0);
    stats.innerHTML = `累计 <strong>${trips.length}</strong> 趟 · <strong>${totalKm.toLocaleString()}</strong> km · 跨 <strong>${years.length}</strong> 年${peakMonth ? ` · 出行最多月份 <strong>${peakMonth} 月</strong>` : ''}`;

    let html = `<div class="heatmap-months"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>10</span><span>11</span><span>12</span></div>`;
    years.forEach(y => {
      html += `<div class="heatmap-row"><span class="heatmap-year-label">${y}</span>`;
      for (let m = 0; m < 12; m++) {
        const cell = agg[y][m];
        const lvl = cell ? levelByDays(cell.days) : 0;
        const title = cell
          ? `${y}.${m + 1} · ${cell.days} 天 · ${cell.trips.length} 趟`
          : `${y}.${m + 1} · 无出行`;
        let inner = '';
        if (cell) {
          const seals = cell.trips.slice(0, 2).map(n => `<a href="#trip-${n}">${tripBadge(n, { size: 22 })}</a>`).join('');
          inner = seals + (cell.trips.length > 2 ? '<sup>+</sup>' : '');
        }
        html += `<div class="heatmap-cell" data-level="${lvl}" title="${title}">${inner}</div>`;
      }
      html += `</div>`;
    });
    grid.innerHTML = html;
  }

  // ====== 年度视图渲染 ======
  function renderYearView() {
    const grid = document.getElementById('heatmap-grid');
    const stats = document.getElementById('heatmap-stats');
    if (!grid || !stats) return;

    // 聚合：year -> { km, days, trips: [seq] }
    const agg = {};
    trips.forEach(t => {
      const y = new Date(t.start).getFullYear();
      agg[y] = agg[y] || { km: 0, days: 0, trips: [] };
      agg[y].km += t.km;
      agg[y].days += t.days;
      agg[y].trips.push(t.seq);
    });

    const years = Object.keys(agg).sort();
    const totalKm = trips.reduce((s, t) => s + t.km, 0);
    const uniqueCities = new Set();
    trips.forEach(t => (t.route || []).forEach(c => uniqueCities.add(c)));
    const recentYear = years[years.length - 1];
    const recentCount = recentYear ? agg[recentYear].trips.length : 0;

    stats.innerHTML = `累计 <strong>${trips.length}</strong> 趟 · <strong>${totalKm.toLocaleString()}</strong> km · 跨 <strong>${uniqueCities.size}</strong> 城 · 最近一年 <strong>${recentCount}</strong> 趟`;

    let html = `<div class="heatmap-year-row">`;
    years.forEach(y => {
      const cell = agg[y];
      const lvl = levelByKm(cell.km);
      const title = `${y} · ${cell.trips.length} 趟 · ${cell.days} 天 · ${cell.km.toLocaleString()} km`;
      const seals = cell.trips.slice(0, 6).map(n => `<a href="#trip-${n}">${tripBadge(n, { size: 18 })}</a>`).join('');
      const ellipsis = cell.trips.length > 6 ? '<sup>…</sup>' : '';
      html += `<div class="heatmap-year-item">
        <div class="heatmap-year-cell" data-level="${lvl}" title="${title}">${seals}${ellipsis}</div>
        <span class="heatmap-year-item-label">${y}</span>
      </div>`;
    });
    html += `</div>`;
    grid.innerHTML = html;
  }

  // ====== 切换 + localStorage ======
  function setHeatmapMode(mode) {
    const buttons = document.querySelectorAll('.heatmap-toggle button');
    buttons.forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    const grid = document.getElementById('heatmap-grid');
    if (grid) grid.style.opacity = '0';
    setTimeout(() => {
      if (mode === 'year') renderYearView(); else renderMonthView();
      if (grid) grid.style.opacity = '1';
    }, 150);
    try { localStorage.setItem('tx-heatmap-mode', mode); } catch (e) {}
  }

  (function initHeatmap() {
    let mode = 'month';
    try { mode = localStorage.getItem('tx-heatmap-mode') || 'month'; } catch (e) {}
    const buttons = document.querySelectorAll('.heatmap-toggle button');
    buttons.forEach(b => {
      b.addEventListener('click', () => setHeatmapMode(b.dataset.mode));
      b.classList.toggle('active', b.dataset.mode === mode);
    });
    if (mode === 'year') renderYearView(); else renderMonthView();
  })();

  // ====== 卡片左上角朱印注入 ======
  (function injectCardSeals() {
    trips.forEach(t => {
      const card = document.getElementById(t.id);
      if (!card) return;
      const top = card.querySelector('.trip-card-top');
      if (!top || card.querySelector('.trip-card-seal')) return;
      const wrap = document.createElement('div');
      wrap.className = 'trip-card-seal';
      wrap.innerHTML = tripBadge(t.seq, { size: 36 });
      card.appendChild(wrap);
    });
  })();
</script>

</body>
