<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十四行记 · 自驾旅行记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2c1f14;
    --ink-mid: #5a3e28;
    --ink-light: #9a7a60;
    --paper: #faf6ef;
    --paper-warm: #f3ead8;
    --paper-mid: #e8dcc8;
    --accent: #b85c38;
    --accent-soft: #d4835f;
    --gold: #c8973a;
    --gold-light: #e8c470;
    --sage: #7a9e7e;
    --stone: #8a7968;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Noto Serif SC', serif;
    font-weight: 300;
    line-height: 1.8;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
  }

  /* ─── HERO ─── */
  .hero {
    position: relative;
    background: var(--ink);
    padding: 56px 28px 44px;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 85% 15%, rgba(200,151,58,0.16) 0%, transparent 55%),
      radial-gradient(ellipse at 15% 85%, rgba(184,92,56,0.12) 0%, transparent 55%);
  }
  .deco-char {
    position: absolute;
    right: 20px;
    bottom: 16px;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 96px;
    color: rgba(200,151,58,0.06);
    line-height: 1;
    pointer-events: none;
    user-select: none;
  }
  .hero-eyebrow {
    display: inline-block;
    font-family: 'Ma Shan Zheng', cursive;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold-light);
    opacity: 0.7;
    margin-bottom: 16px;
    position: relative;
  }
  .hero h1 {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 40px;
    color: #f5edd8;
    line-height: 1.2;
    letter-spacing: 4px;
    position: relative;
  }
  .hero-desc {
    margin-top: 12px;
    font-size: 13px;
    color: rgba(245,237,216,0.45);
    letter-spacing: 1.5px;
    position: relative;
  }
  .hero-line {
    margin-top: 28px;
    height: 1px;
    background: linear-gradient(90deg, rgba(200,151,58,0.4), transparent);
    position: relative;
  }
  .hero-meta {
    margin-top: 14px;
    display: flex;
    gap: 20px;
    position: relative;
  }
  .hero-meta span {
    font-size: 11px;
    color: rgba(245,237,216,0.35);
    letter-spacing: 1px;
  }
  .hero-meta strong {
    color: rgba(245,237,216,0.7);
    font-weight: 400;
  }

  /* ─── YEAR GROUP ─── */
  .year-group {
    padding: 28px 24px 0;
  }
  .year-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .year-label span {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 20px;
    color: var(--ink);
    letter-spacing: 2px;
  }
  .year-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--paper-mid);
  }

  /* ─── TRIP CARD ─── */
  .trip-card {
    display: block;
    text-decoration: none;
    background: white;
    border: 1px solid var(--paper-mid);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    transition: border-color 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .trip-card:active {
    transform: scale(0.985);
    border-color: var(--accent-soft);
  }
  .trip-card-top {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--paper-warm);
  }
  .trip-route {
    font-family: 'ZCOOL XiaoWei', serif;
    font-size: 18px;
    letter-spacing: 1px;
    color: var(--ink);
    line-height: 1.3;
  }
  .trip-route .arrow {
    color: var(--accent-soft);
    margin: 0 4px;
    font-size: 14px;
  }
  .trip-title {
    font-size: 12px;
    color: var(--stone);
    margin-top: 3px;
    letter-spacing: 0.5px;
  }
  .trip-card-bottom {
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .trip-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 3px;
    letter-spacing: 0.5px;
  }
  .tag-drive { background: #fdeee8; color: var(--accent); }
  .tag-days { background: var(--paper-warm); color: var(--stone); }
  .tag-season { background: #eef5ee; color: var(--sage); }
  .trip-date {
    font-size: 11px;
    color: var(--stone);
    letter-spacing: 0.5px;
    white-space: nowrap;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .trip-km {
    font-size: 10px;
    color: var(--ink-light);
  }

  /* ─── PLACEHOLDER ─── */
  .placeholder-card {
    border: 1px dashed var(--paper-mid);
    border-radius: 12px;
    padding: 22px 18px;
    text-align: center;
    margin-bottom: 12px;
  }
  .placeholder-card p {
    font-size: 12px;
    color: var(--stone);
    letter-spacing: 1px;
  }

  /* ─── FOOTER ─── */
  .footer {
    text-align: center;
    padding: 32px 24px 28px;
    font-size: 11px;
    color: var(--stone);
    letter-spacing: 2px;
    border-top: 1px solid var(--paper-mid);
    margin-top: 20px;
  }
  .footer .sub {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    color: var(--paper-mid);
    letter-spacing: 1px;
  }

  /* ============================
     旅行状态徽章 · Trip Status
     ============================ */
  .trip-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Noto Serif SC', serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    padding: 4px 12px;
    border-radius: 20px;
    line-height: 1;
    white-space: nowrap;
    vertical-align: middle;
  }

  .trip-status::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* 规划中 */
  .trip-status[data-status="planning"] {
    color: var(--ink-light, #9a7a60);
    background: var(--paper-mid, #e8dcc8);
    border: 1px dashed var(--ink-light, #9a7a60);
  }
  .trip-status[data-status="planning"]::before {
    background: var(--ink-light, #9a7a60);
    opacity: 0.6;
  }

  /* 进行中 */
  .trip-status[data-status="active"] {
    color: var(--gold, #c8973a);
    background: rgba(200, 151, 58, 0.1);
    border: 1px solid var(--gold-light, #e8c470);
  }
  .trip-status[data-status="active"]::before {
    background: var(--gold, #c8973a);
    animation: status-pulse 2s ease-in-out infinite;
  }

  @keyframes status-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
  }

  /* 已完成 */
  .trip-status[data-status="completed"] {
    color: var(--sage, #7a9e7e);
    background: rgba(122, 158, 126, 0.1);
    border: 1px solid var(--sage, #7a9e7e);
  }
  .trip-status[data-status="completed"]::before {
    background: var(--sage, #7a9e7e);
  }

  /* 深色背景版（用于详情页 Hero 区） */
  .trip-status.on-dark[data-status="completed"] {
    color: var(--sage, #7a9e7e);
    background: rgba(122, 158, 126, 0.15);
    border-color: rgba(122, 158, 126, 0.4);
  }
  .trip-status.on-dark[data-status="active"] {
    color: var(--gold-light, #e8c470);
    background: rgba(232, 196, 112, 0.15);
    border-color: rgba(232, 196, 112, 0.4);
  }
  .trip-status.on-dark[data-status="planning"] {
    color: rgba(255, 255, 255, 0.5);
    background: rgba(255, 255, 255, 0.06);
    border: 1px dashed rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body>

<div class="hero">
  <div class="deco-char">行</div>
  <div class="hero-eyebrow">ROAD TRIP JOURNAL</div>
  <h1>十四行记</h1>
  <p class="hero-desc">自驾 · 行旅 · 记录</p>
  <div class="hero-line"></div>
  <div class="hero-meta">
    <span><strong id="trip-count">—</strong> 次旅行</span>
    <span><strong id="km-count">—</strong> 公里</span>
    <span><strong id="city-count">6</strong> 座城市</span>
  </div>
</div>

<div class="year-group">
  <div class="year-label">
    <span>2026</span>
  </div>

  <a class="trip-card" href="trips/2026-05-bjs-tsn.html">
    <div class="trip-card-top">
      <div class="trip-route">
        北京<span class="arrow">→</span>天津
      </div>
      <div class="trip-title">周末两日 · 海河与五大道</div>
    </div>
    <div class="trip-card-bottom">
      <div class="trip-tags">
        <span class="tag tag-drive">自驾</span>
        <span class="tag tag-days">2 天</span>
        <span class="tag tag-season">春季</span>
      </div>
      <div style="text-align:right;">
        <div class="trip-date">2026.5.16 – 5.17</div>
        <div class="trip-km">约 260 km</div>
      </div>
      <span class="trip-status" data-status="planning">规划中</span>
    </div>
  </a>

  <a class="trip-card" href="trips/2026-05-xiy-bjs.html">
    <div class="trip-card-top">
      <div class="trip-route">
        西安<span class="arrow">→</span>洛阳<span class="arrow">→</span>平遥<span class="arrow">→</span>北京
      </div>
      <div class="trip-title">五一自驾 · 穿越中原与山西</div>
    </div>
    <div class="trip-card-bottom">
      <div class="trip-tags">
        <span class="tag tag-drive">自驾</span>
        <span class="tag tag-days">7 天</span>
        <span class="tag tag-season">春季</span>
      </div>
      <div style="text-align:right;">
        <div class="trip-date">2026.5.1 – 5.7</div>
        <div class="trip-km">约 1,380 km</div>
      </div>
      <span class="trip-status" data-status="completed">已完成</span>
    </div>
  </a>

  <div class="placeholder-card">
    <p>下一次旅行，待续……</p>
  </div>
</div>

<div class="footer">
  十四行记 · 两人同行
  <span class="sub">github.io · static travel journal</span>
</div>

<script>
  // ====== 数据源 ======
  const trips = [
    {
      id: 'trip-1',
      file: 'trips/2026-05-xiy-bjs.html',
      start: '2026-05-01',
      end: '2026-05-07',
      days: 7,
      km: 1380,
      status: 'completed',
      route: ['西安', '洛阳', '平遥', '北京'],
      title: '五一自驾 · 穿越中原与山西',
      summary: '西安 → 北京 · 五一七日'
    },
    {
      id: 'trip-2',
      file: 'trips/2026-05-bjs-tsn.html',
      start: '2026-05-16',
      end: '2026-05-17',
      days: 2,
      km: 260,
      status: 'planning',
      route: ['北京', '天津'],
      title: '周末两日 · 海河与五大道',
      summary: '北京 → 天津 · 周末两日'
    }
  ].sort((a, b) => a.start.localeCompare(b.start));

  // 运行时序号 = 数组索引 + 1（按 start 升序）
  trips.forEach((t, i) => { t.seq = i + 1; });

  // ====== 朱印徽章模板 ======
  function tripBadge(n, opts) {
    const size = (opts && opts.size) || 32;
    const fontSize = Math.round(size * 0.7);
    return `<svg class="trip-seal" viewBox="0 0 48 48" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg" aria-label="第${n}段">
      <rect x="2" y="2" width="44" height="44" rx="6" fill="var(--accent)"/>
      <!-- y: viewBox 中线 24 + 约 35% fontSize 用于视觉居中（基线补偿） -->
      <text x="24" y="${24 + fontSize * 0.35}" text-anchor="middle"
            font-family="'ZCOOL XiaoWei', serif" font-size="${fontSize}"
            fill="var(--paper)" font-weight="600">${n}</text>
    </svg>`;
  }

  // ====== 自动 hero 统计 ======
  (function updateHeroStats() {
    const tcEl = document.getElementById('trip-count');
    const kmEl = document.getElementById('km-count');
    if (tcEl) tcEl.textContent = trips.length;
    if (kmEl) kmEl.textContent = trips.reduce((s, t) => s + t.km, 0).toLocaleString();
    // city-count 保留手填（route 数据未完整时不自动算）
  })();
</script>

</body>
</html>
